services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        API_URL: ${API_URL}
    container_name: atlas_frontend
    environment:
      API_URL: ${API_URL}
      AUTH_RETURN_URL_ORIGIN: ${AUTH_RETURN_URL_ORIGIN}
    ports:
      - '${FRONTEND_PORT:-3001}:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
