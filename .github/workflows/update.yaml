name: Sync Updates
on:
  push:
    branches:
      - 'dev'
      - 'alpha'

jobs:
  alpha:
    runs-on: ubuntu-latest
    if: github.ref_name == 'dev'
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: alpha
      - name: Reset promotion branch
        run: |
          git fetch origin ${{github.ref_name}}:${{github.ref_name}}
          git reset --hard ${{github.ref_name}}
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@2271f1ddcf09437ed8f019733eb5cfba58ac76f0
        with:
          labels: automated pr
          branch: ${{github.ref_name}}
          title: chore(sync) Syncing changes from ${{github.ref_name}} to alpha

  master:
    runs-on: ubuntu-latest
    if: github.ref_name == 'alpha'
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: master
      - name: Reset promotion branch
        run: |
          git fetch origin ${{github.ref_name}}:${{github.ref_name}}
          git reset --hard ${{github.ref_name}}
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@2271f1ddcf09437ed8f019733eb5cfba58ac76f0
        with:
          labels: automated pr
          branch: ${{github.ref_name}}
          title: chore(sync) Syncing changes from ${{github.ref_name}} to master
